bio: |-
  Diplômé d'Epitech Montpellier en 2021, j'ai commencé à coder enfant et je n'ai jamais arrêté. J'aime autant comprendre un système de bout en bout que le rendre plus simple à exploiter.
  Depuis 2020 chez Enix, un infogéreur spécialiste de Kubernetes, je développe des composants d'infrastructure open source et j'exploite les plateformes qui les font tourner. Mon terrain de jeu : le code d'infrastructure, entre développement et exploitation.

