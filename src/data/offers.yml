offers:
  - id: tooling
    title: Outillage Kubernetes en Go
    summary: Des composants qui tournent dans vos clusters et que vos équipes peuvent maintenir après mon départ.
    points:
      - Opérateurs, contrôleurs et webhooks d'admission avec kubebuilder et controller-runtime
      - Exporters Prometheus, CLI d'administration et intégrations d'API
      - Tests, CI, releases et documentation livrés avec le code
    proofs: [kube-image-keeper, topomatik, pvecontrol, x509-certificate-exporter]

  - id: platform
    title: Plateformes Kubernetes
    summary: Construction de clusters et de leur stockage, avec l'expérience d'un cloud privé opéré en production.
    points:
      - Clusters avec kubeadm, Cluster API, Rancher ou Talos, sur machines virtuelles ou bare metal
      - Stockage persistant avec drivers CSI, ZFS, SAN iSCSI et Ceph RBD
      - Cloud privé OpenStack sur Kubernetes exploité en production de 2022 à 2024, 7 montées de version majeures
    proofs: [san-iscsi-csi, zfs-localpv]

  - id: ai
    title: Développement assisté par IA
    summary: Une méthode que j'applique sur un projet open source en production, pas une promesse de résultats.
    points:
      - Spécification figée comme source de vérité, instructions pour les agents, notes de décision versionnées
      - Revue de code automatisée, hooks de commit, tests avant chaque publication
      - Réécriture de kube-image-keeper v3 menée avec une équipe d'agents
    proofs: [kube-image-keeper]

closing: Je propose aussi des audits et un accompagnement de vos équipes sur ces sujets.
