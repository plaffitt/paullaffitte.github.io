starsReadOn: septembre 2026

projects:
  - id: kube-image-keeper
    name: kube-image-keeper (kuik)
    role: Développeur principal et mainteneur
    pitch: Routage, mirroring et supervision d'images de conteneurs pour Kubernetes. Vos pods démarrent même quand la registry tombe ou vous limite.
    facts:
      - 750 étoiles GitHub, en production sur plusieurs clusters
      - Environ 790 commits, chart Helm, site de documentation, processus de release
      - Réécriture v3 en cours, première alpha publiée en septembre 2026
    link: https://github.com/enix/kube-image-keeper
    type: featured

  - id: topomatik
    name: topomatik
    role: Premier contributeur
    pitch: Met à jour automatiquement les labels de topologie des nœuds Kubernetes à partir de l'infrastructure découverte.
    facts:
      - Moteurs de découverte LLDP, matériel, réseau, hostname et fichiers
      - Gestion des taints, fonctionne sur nœuds virtuels et bare metal
      - Présenté par Enix aux Cloud Native Days France 2026
    link: https://github.com/enix/topomatik
    type: featured

  - id: pvecontrol
    name: pvecontrol
    role: Co-développeur
    pitch: CLI d'administration de clusters Proxmox VE, écrite en Python.
    facts:
      - Tests et CI, format de sortie configurable, sanity checks
      - Restauration de VM, évacuation de nœuds
      - Support des clusters derrière un reverse proxy avec authentification par certificat
    link: https://github.com/enix/pvecontrol
    type: featured

  - id: x509-certificate-exporter
    name: x509-certificate-exporter
    role: Contributeur
    pitch: Exporter Prometheus pour les certificats X.509, pensé pour Kubernetes.
    facts:
      - 950 étoiles GitHub
      - Filtrage des namespaces par labels, probes configurables
    link: https://github.com/enix/x509-certificate-exporter
    type: featured

  - id: san-iscsi-csi
    name: san-iscsi-csi
    role: Développeur
    pitch: Driver CSI pour les baies SAN iSCSI Dothill et Seagate, avec provisionnement dynamique de volumes.
    facts:
      - Repris par Seagate en janvier 2023 sous le nom seagate-exos-x-csi
      - Retour d'expérience publié sur le blog Enix
    link: https://github.com/enix/san-iscsi-csi
    type: featured

