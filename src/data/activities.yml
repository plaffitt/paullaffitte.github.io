      Développement et administration d'une plateforme de streaming en réalité virtuelle.
      C'est lors de ma 2e année à Epitech que je rejoins l'équipe de VRX Technologies, une jeune start-up française, d'abord en tant que stagiaire, puis en tant que freelance.
    skills:
      - php
      - docker
      - dockerCompose
      - kubernetes
      - js
      - sql
      - python
      - shellScript
      - opengl
      - webgl

