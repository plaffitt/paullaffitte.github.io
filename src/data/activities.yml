xppro:
  enix:
    title: Enix
    role: Platform Engineer
    location: Paris et télétravail
    from: septembre 2020
    summary: |-
      Enix est un infogéreur spécialiste de Kubernetes et de l'hébergement. J'y conçois, développe et exploite des briques d'infrastructure cloud-native, la plupart open source.
    highlights:
      - "kube-image-keeper : création et maintenance d'un système de routage et de mirroring d'images de conteneurs pour Kubernetes, en Go. 750 étoiles, en production, v3 en cours."
      - "topomatik, pvecontrol, x509-certificate-exporter : outillage Kubernetes et Proxmox en Go et Python, avec tests, CI et releases."
      - "Driver CSI san-iscsi-csi pour baies SAN iSCSI, repris par Seagate en 2023."
      - "Cloud privé OpenStack sur Kubernetes, en production et pré-production de 2022 à 2024 : 7 montées de version consécutives de Rocky à Yoga, intégration d'Octavia et de Cinder sur Ceph RBD, sauvegardes et vérifications automatisées autour des montées de version, runbooks d'exploitation. 24 hyperviseurs bare metal."
      - "Clusters Kubernetes de développement et de pré-production avec kubeadm, Cluster API et Rancher."
      - "Livraison pour une banque d'un service SFTPGo sur Docker Compose, en production et pré-production."
    links:
      - label: kube-image-keeper
        url: https://github.com/enix/kube-image-keeper
      - label: Enix
        url: https://enix.io/

  vrxTech:
    title: VRX Technologies
    role: Développeur full stack
    location: Barcelone et Paris
    from: août 2017
    to: août 2020
    summary: |-
      Plateforme de streaming vidéo en réalité virtuelle, rejointe en 2e année d'Epitech, puis développée en freelance pendant 3 ans.
    highlights:
      - Ferme d'encodage vidéo basée sur ffmpeg
      - Lecteur vidéo VR avec gestion des projections, des qualités et des casques
      - Back-office, module de gestion de la TVA, paiements en ligne et en cryptomonnaies
      - Déploiement de toute la stack et automatisation de l'exploitation
    links: []

  iamanys:
    title: Iamanys
    role: Développeur full stack
    location: Montpellier
