    to: avril 2016
    summary: |-
      Logiciel web de suivi de patients en Java (GWT), utilisé par des médecins et des infirmiers et commercialisé auprès de Bastide.
    highlights:
      - Refonte complète de la messagerie interne de l'application
      - Écriture d'un parseur JSON
      - Écriture de tests unitaires
    links: []

